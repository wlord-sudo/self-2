# Clash Party / Mihomo Rule Providers + manual proxy selection
# IMPORT AS AN OVERWRITE, not as a standalone node subscription.
# The '去广告' group is a MANUAL node picker for BY/RU/IS/GF/DK/NO/FI.
# It is NOT an ad-blocking rule and does not reject any advertisements.
# No automatic latency checks in proxy-groups. Other settings unchanged.
# Netflix domain-only; ChinaMedia excluded; retains Europe node group.

