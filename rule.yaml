# Clash Party / Mihomo 精简覆写配置
# 导入“覆写”，并启用规则提供者、规则、代理组这三部分的覆写。
# 规则来源：ACL4SSR 精简服务列表；Netflix 保留 MetaCubeX 域名 MRS。
# 与原始大列表相比覆盖范围有所收窄，未单列域名按后续 GEOIP / MATCH 处理。
# AI 和 YouTube 优先于 Google / Microsoft 通用规则。
# MR_AIExtra 为原有 AI 规则中保留的补充域名；自动更新列表仍为 http。
# 所有代理组保留手动选择；“去广告”为原有选节点分组。
# 欧洲支持国家缩写，另补充卢森堡中文名、Luxembourg、LUX、国旗。
# 修复原澳门分组正则缺失右括号。

rule-providers:
  MR_Lan:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
    path: ./rule-providers/lite/MR_Lan.list
    interval: 86400
  MR_Google:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list
    path: ./rule-providers/lite/MR_Google.list
    interval: 86400
  MR_Microsoft:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
