    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
    path: ./rule-providers/lite/MR_Apple.list
    interval: 86400
  MR_Telegram:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Telegram.list
    path: ./rule-providers/lite/MR_Telegram.list
    interval: 86400
  MR_GlobalAI:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list
    path: ./rule-providers/lite/MR_GlobalAI.list
    interval: 86400
  MR_YouTube:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
    path: ./rule-providers/lite/MR_YouTube.list
    interval: 86400
  MR_NetflixDomain:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs
    path: ./rule-providers/MR_NetflixDomain.mrs
    interval: 86400
  MR_BiliBili:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Bilibili.list
    path: ./rule-providers/lite/MR_BiliBili.list
    interval: 86400
  MR_Twitter:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Twitter.list
    path: ./rule-providers/lite/MR_Twitter.list
    interval: 86400
  MR_Disney:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/DisneyPlus.list
    path: ./rule-providers/lite/MR_Disney.list
    interval: 86400
  MR_ProxyLite:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
    path: ./rule-providers/MR_ProxyLite.list
    interval: 86400
  MR_AIExtra:
    type: inline
    behavior: classical
    payload:
    - DOMAIN-SUFFIX,githubcopilot.com
    - DOMAIN-SUFFIX,copilot.com
    - DOMAIN-SUFFIX,grok.com
