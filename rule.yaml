- name: 🇭🇰 香港节点
  type: select
  include-all: true
  filter: (港|HK|hk|Hong Kong|HongKong|hongkong)
- name: 🇯🇵 日本节点
  type: select
  include-all: true
  filter: (日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)
- name: 🇺🇲 美国节点
  type: select
  include-all: true
  filter: (美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|CA|United States)
- name: 🇺🇲 美国节点-Ai
  type: select
  include-all: true
  filter: (美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|CA|United States)
- name: 🇨🇳 台湾节点
  type: select
  include-all: true
  filter: (台|新北|彰化|TW|Taiwan)
- name: 🇸🇬 狮城节点
  type: select
  include-all: true
  filter: (新加坡|坡|狮城|SG|Singapore)
- name: 🇰🇷 韩国节点
  type: select
  include-all: true
  filter: (KR|Korea|KOR|首尔|韩|韓)
- name: 🇲🇴 澳门节点
  type: select
  include-all: true
  filter: (MO|澳门)
- name: 🇪🇺 欧洲节点
  type: select
  include-all: true
  filter: (?i)(?:^|[^a-z0-9])(?:AL|AD|AM|AT|AZ|BY|BE|BA|BG|HR|CY|CZ|DK|EE|FI|FR|GE|DE|GR|HU|IS|IE|IT|XK|LV|LI|LT|LU|LUX|MT|MD|MC|ME|NL|MK|NO|PL|PT|RO|RU|SM|RS|SK|SI|ES|SE|CH|TR|UA|UK|GB|VA|EU)[0-9]*(?:$|[^a-z0-9])|卢森堡|Luxembourg|🇱🇺
- name: 去广告
  type: select
  include-all: true
  filter: (BY|RU|IS|GF|DK|NO|FI)
